name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build release artifact
        run: |
          pnpm run build
          tar -czf skills-as-code-site-${RELEASE_TAG}.tar.gz dist

      - name: Ensure dispatch tag exists
        if: github.event_name == 'workflow_dispatch'
        id: dispatch_tag
        run: |
          git fetch --tags
          if ! git rev-parse --verify --quiet "${RELEASE_TAG}"; then
            git tag "${RELEASE_TAG}"
            git push origin "${RELEASE_TAG}"
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: github.event_name == 'push' || steps.dispatch_tag.outputs.created == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            "skills-as-code-site-${RELEASE_TAG}.tar.gz" \
            --verify-tag \
            --generate-notes \
            --title "${RELEASE_TAG}"
